# Test video for clip scenes: a made clip, drawn by the project's maker (videos/make-clip.ts),
# narrated line by line on its events. After changing a line:
#   npm run video -- make clip-demo --fit   the fit to the voice, in seconds, nothing drawn
#   npm run video -- make clip-demo         the clip drawn to the voice, checked and built: out/
title: A clip on cue
voice: af_heart
fps: 30
formats: [landscape, portrait]

scenes:
  - id: square
    scene: clip
    make: square                       # its files: clips/square-landscape.mp4 and the rest
    narration:
      - text: "This square is a clip: a short video file, with a little JSON beside it."
        cue: start
      - text: "Here it slides: the JSON names the clip's events, and a line can cue to one."
        cue: slide
      - text: And here it rises, on cue.
        cue: rise
      - text: The clip was drawn again to fit this voice, so each move starts with its line.
