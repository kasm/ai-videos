<!doctype html>
<!-- The page of `serve` (serve.ts), which fills what is in double braces: a story to its videos, in a browser. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A story to its videos</title>
<link rel="icon" href="data:," />
<style nonce="{{nonce}}">
  :root {
    color-scheme: light dark;
    --edge: light-dark(#c4c4c4, #5a5a5a);
    --quiet: light-dark(#5c5c5c, #a8a8a8);
    --bad: light-dark(#b3261e, #ff8a80);
    --mark: light-dark(#1a56c4, #8ab4f8);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
  main { max-width: 52rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  h1 { font-size: 1.5rem; margin: 0; }
  h2 { font-size: 1.15rem; margin: 2.25rem 0 0; }
  code { font: 0.9em ui-monospace, Consolas, monospace; }
  label { display: block; font-weight: 600; margin: 1rem 0 0.25rem; }
  input, textarea, select, button { font: inherit; color: inherit; }
  input, textarea, select { border: 1px solid var(--edge); border-radius: 0.4rem; padding: 0.5rem 0.6rem; background: Field; }
  input, textarea { display: block; width: 100%; }
  textarea { resize: vertical; }
  #prompt { font: 13px/1.45 ui-monospace, Consolas, monospace; }
  button { padding: 0.5rem 1.1rem; border: 1px solid var(--edge); border-radius: 0.4rem; background: ButtonFace; cursor: pointer; }
  button.main { border-color: transparent; background: var(--mark); color: Canvas; font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { margin: 0.25rem 0 0; color: var(--quiet); font-size: 0.9rem; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-top: 1rem; }
  .row label { margin: 0; }
  .said { min-height: 1.5em; margin: 0.6rem 0 0; white-space: pre-wrap; }
  .said.bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>A story to its videos</h1>
  <p class="hint">In the project <code>{{project}}</code>, on this machine alone.</p>

  <h2>1. The story</h2>
  <label for="name">Its name</label>
  <input id="name" autocomplete="off" spellcheck="false" placeholder="the-race" />
  <p class="hint">Lowercase letters, digits and dashes. The text is saved as <code>stories/&lt;name&gt;.md</code>, and its episodes are named after it.</p>
  <label for="text">Its text</label>
  <textarea id="text" rows="14" placeholder="Paste the story here."></textarea>
  <div class="row">
    <label for="language">Its episodes in</label>
    <select id="language">{{languages}}</select>
    <span id="told" class="hint"></span>
  </div>
  <div class="row">
    <button id="save" class="main" type="button">Save, and copy its prompt</button>
  </div>
  <p id="saved" class="said" role="status"></p>

  <h2>2. Its prompt</h2>
  <p id="of" class="hint">The story, wrapped in what a web chat needs to write its episodes.</p>
  <label for="prompt">The prompt</label>
  <textarea id="prompt" rows="14" readonly spellcheck="false"></textarea>
  <div class="row">
    <button id="copy" type="button" disabled>Copy</button>
  </div>
  <p id="copied" class="said" role="status"></p>
</main>
<script nonce="{{nonce}}">
(() => {
  const at = (id) => document.getElementById(id);
  const name = at("name"), text = at("text"), language = at("language"), told = at("told"), save = at("save"), saved = at("saved");
  const of = at("of"), prompt = at("prompt"), copy = at("copy"), copied = at("copied");
  /** Each language's name, by its code. */
  const named = Object.fromEntries([...language.options].map((option) => [option.value, option.textContent]));

  const say = (where, what, bad = false) => {
    where.textContent = what;
    where.classList.toggle("bad", bad);
  };

  /** Asks the server, and gives its answer: throws what it refused. */
  async function ask(path, body) {
    let response;
    try {
      response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    } catch {
      throw new Error("The server does not answer: is serve still running in its terminal?");
    }
    const answer = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(answer.error ?? `The server said ${response.status}.`);
    return answer;
  }

  // The language is what the text's letters say, asked of the server as the text changes. It is
  // picked again only when they come to say another, so a pick by hand stays while they say the same.
  let lettersSay = "";
  let asking = 0;
  let telling = Promise.resolve();
  const note = () => {
    const none = text.value.trim() === "" || lettersSay === "";
    told.textContent = none ? "" : language.value === lettersSay ? "as the text's letters say" : `the text's letters say ${named[lettersSay]}`;
  };
  const tell = () => {
    const mine = ++asking;
    telling = ask("/language", { text: text.value }).then(
      (answer) => {
        if (mine !== asking) return;
        if (answer.language !== lettersSay) language.value = answer.language;
        lettersSay = answer.language;
        note();
      },
      () => {},
    );
  };
  text.addEventListener("input", tell);
  language.addEventListener("change", note);
  // A browser may keep a field's text when the page is loaded again.
  if (text.value.trim() !== "") tell();

  /** Puts a text on the clipboard: false when the browser does not let it. */
  async function toClipboard(value) {
    try {
      await navigator.clipboard.writeText(value);
      return true;
    } catch {
      return false;
    }
  }
  const onClipboard = async (value) => {
    if (await toClipboard(value)) say(copied, "The prompt is on the clipboard: paste it into a new chat, ChatGPT or any other.");
    else say(copied, "The browser did not let the prompt onto the clipboard: press Copy.", true);
  };

  save.addEventListener("click", async () => {
    save.disabled = true;
    say(saved, "Saving, and writing its prompt…");
    try {
      await telling;
      const answer = await ask("/story", { name: name.value.trim(), text: text.value, language: language.value });
      say(saved, answer.saved ? `Saved as ${answer.file}.` : `${answer.file} holds this text already: nothing written.`);
      prompt.value = answer.prompt;
      copy.disabled = false;
      of.textContent = `Of ${answer.file}, for episodes in ${named[answer.language]}: ${answer.prompt.length} characters.`;
      await onClipboard(answer.prompt);
    } catch (e) {
      say(saved, e.message, true);
    }
    save.disabled = false;
  });
  copy.addEventListener("click", () => onClipboard(prompt.value));
})();
</script>
</body>
</html>
