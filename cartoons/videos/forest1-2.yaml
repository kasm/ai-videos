use: cartoon
scenes:
  - background: elm-bower
    places: { mole: left, squirrel: middle, marten: off-right, badger: off-right }
    faces: { squirrel: left, marten: left, badger: left }
    script: |
      narrator say: Squirrel swung the car along a ropeway.
      mole say: What's inside that fat wicker basket?
      squirrel say: Chestnuts, hazelnuts, honeycomb, berries,
      squirrel say: birch-sap, and elderflower wine!
      mole jump
      & mole say: O stop, stop! So this is a Forest!
      squirrel say: The Forest! My world, and I want no other.
      mole point
      & mole say: What lies over there in those dark yews?
      squirrel turn
      & mole stand
      squirrel point
      & squirrel say: Just the Deep Thicket. Dear Badger lives there.
      squirrel say: Never trust the weasels, stoats, or foxes.
      squirrel turn
      & squirrel stand
      squirrel say: Now, here's our mossy platform for lunch!
      mole say: O my! What a feast!
      marten walk to=right
      & in order:
        narrator say: A sleek Pine Marten hauled onto the bough.
        marten say: Greedy beggars! All the world is out today.
      squirrel say: Come on up, old Badger!
      badger say: H'm! Company.
      narrator say: Badger vanished back into the ferns.
      squirrel say: Simply hates Society. Who else is out?
      marten say: Toad's out in his new gliding-contraption!
      narrator say: A canvas glider flashed wildly overhead.
      marten say: He'll be out of that in a minute!
      marten turn
      marten walk to=off-right
      & in order:
        narrator say: A beetle buzzed past. Snap! Marten vanished.
        narrator say: Politely, Mole repacked the lunch basket.
