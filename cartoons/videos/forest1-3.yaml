use: cartoon
scenes:
  - background: canopy
    places: { mole: left, squirrel: right }
    faces: { squirrel: left }
    script: |
      narrator say: As the sun dipped, Mole grew restless.
      mole say: Squirrelly! Let me work the hoist-rope now!
      squirrel say: Not yet, my friend. Wait for lessons.
      mole jump
      & narrator say: Proud Mole jumped up and yanked the brake!
      narrator say: Whoosh! Over tipped the car through the leaves.
      narrator say: Squirrel caught him and righted the basket.
      mole say: Squirrelly, I am sorry! I was a complete ass.
      mole say: Will you forgive me?
      squirrel wave
      & squirrel say: Bless you, what's a little tumble to me?
      squirrel say: Stay with me, and I'll teach you to climb.
      squirrel stand
      & mole jump
      & narrator say: Touched, Mole wiped a tear and cheered up.
  - background: squirrel-drey
    places: { squirrel: left, mole: right }
    faces: { mole: left }
    script: |
      narrator say: At home, Squirrel lit a bright resin-lamp.
      narrator say: He told thrilling tales before the fire.
      squirrel wave
      & squirrel say: Sleep well in the bedroom-hollow, Mole.
      squirrel stand
      & mole say: Thank you, my friend. Goodnight.
      narrator say: That day was the first of many in the canopy.
