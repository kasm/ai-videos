# The first script, written by `new` from the clip's own texts: a line each, cued to the event it
# begins at. The voice, formats and loudness are the project file's, beside this folder; a setting
# written here overrides it. A line's speaker takes its voice from the cast there; a line with none
# is said in the project's voice. After changing a line, `make <this folder> --fit` tries the timing.
title: the-shy-visitor
scenes:
  - id: the-shy-visitor
    scene: clip
    make: the-shy-visitor
    narration:
      - text: It is a sunny morning in the meadow.
        cue: morning
      - speaker: mo
        text: Oh, nothing ever happens here.
        cue: mo-sighs
      - text: Just then, somebody new walks in.
        cue: tuk-walks-in
      - text: It is Tuk, who has come over the hills.
        cue: tuk-walks-in
      - speaker: pip
        text: Hello! Hello there!
        cue: pip-waves
      - text: Tuk is shy.
        cue: tuk-is-shy
      - speaker: tuk
        text: Hello.
        cue: tuk-says-hello
      - speaker: mo
        text: You there! Where do you come from?
        cue: mo-points
      - speaker: tuk
        text: I come from far away, behind the hills.
        cue: tuk-answers
      - speaker: tuk
        text: I am looking for a place to sleep.
        cue: tuk-asks
      - speaker: tuk
        text: The night is near.
        cue: night-is-near
      - text: And the sun goes down.
        cue: sun-goes-down
      - speaker: pip
        text: You can stay with us, Tuk.
        cue: pip-invites
      - speaker: pip
        text: The meadow is big enough for three.
        cue: big-enough
      - text: Tuk is so glad!
        cue: tuk-jumps
      - text: Then the night falls, and the moon comes up.
        cue: night-falls
      - speaker: pip
        text: Good night, Tuk.
        cue: good-night
      - speaker: tuk
        text: Good night, Pip. Good night, Mo.
        cue: good-night
      - speaker: mo
        text: Good night, you two.
        cue: good-night
      - text: And Mo was wrong. Something did happen today.
        cue: mo-was-wrong
