# Everything the format has, in one short day: each pose (stand, wave, point), each move (walk,
# turn, jump), eyes that blink, and a background that changes twice while Pip and Mo stay where
# they are. The format is in CLAUDE.md ("The scenario").

characters:
  pip:
    shoulder: [100, -203] # the middle of the arm's upper end: the arm turns around it
    parts: # drawn in this order; written facing right; x right and y down from the point between the feet
      body:
        - { shape: rect, at: [0, -170], size: [220, 340], round: 110, fill: "#f2a33a" }
      arm: # hanging down on Pip's front side, over the body
        - { shape: rect, at: [100, -150], size: [44, 150], round: 22, fill: "#d9861f" }
      eyes:
        - { shape: ellipse, at: [-45, -250], size: [48, 60], fill: "#ffffff" }
        - { shape: ellipse, at: [45, -250], size: [48, 60], fill: "#ffffff" }
        - { shape: ellipse, at: [-30, -246], size: [20, 26], fill: "#2b2d42" } # looking right, the way Pip faces
        - { shape: ellipse, at: [60, -246], size: [20, 26], fill: "#2b2d42" }
      mouth:
        - { shape: ellipse, at: [0, -170], size: [70, 18], fill: "#5b2333" }
  mo:
    shoulder: [85, -265]
    parts: # taller and narrower than Pip, and blue; written facing right too
      body:
        - { shape: rect, at: [0, -215], size: [190, 430], round: 95, fill: "#6aa9e9" }
      arm:
        - { shape: rect, at: [85, -200], size: [40, 170], round: 20, fill: "#3f7fc4" }
      eyes:
        - { shape: ellipse, at: [-40, -330], size: [44, 56], fill: "#ffffff" }
        - { shape: ellipse, at: [40, -330], size: [44, 56], fill: "#ffffff" }
        - { shape: ellipse, at: [-28, -326], size: [18, 24], fill: "#2b2d42" }
        - { shape: ellipse, at: [52, -326], size: [18, 24], fill: "#2b2d42" }
      mouth:
        - { shape: ellipse, at: [0, -250], size: [60, 16], fill: "#27324f" }

backgrounds:
  day:
    fill: "#bfe3ff" # the sky
    shapes:
      - { shape: ellipse, at: [1560, 220], size: [180, 180], fill: "#ffd966" } # the sun, high
      - { shape: rect, at: [960, 950], size: [1920, 260], fill: "#7cc36a" } # the grass
  sundown:
    fill: "#f6b26b"
    shapes:
      - { shape: rect, at: [960, 200], size: [1920, 400], fill: "#f9cb9c" } # the sky is paler higher up
      - { shape: ellipse, at: [1700, 790], size: [240, 240], fill: "#e8542f" } # the sun, half behind the grass
      - { shape: rect, at: [960, 950], size: [1920, 260], fill: "#5f9a55" }
  night:
    fill: "#1b2a4a"
    shapes:
      - { shape: ellipse, at: [1500, 220], size: [160, 160], fill: "#f4f1de" } # the moon
      - { shape: ellipse, at: [300, 160], size: [14, 14], fill: "#f4f1de" } # the stars
      - { shape: ellipse, at: [620, 300], size: [10, 10], fill: "#f4f1de" }
      - { shape: ellipse, at: [900, 120], size: [12, 12], fill: "#f4f1de" }
      - { shape: ellipse, at: [1150, 340], size: [10, 10], fill: "#f4f1de" }
      - { shape: ellipse, at: [1780, 420], size: [12, 12], fill: "#f4f1de" }
      - { shape: rect, at: [960, 950], size: [1920, 260], fill: "#2f5d46" }

scenes:
  - background: day
    places:
      pip: [640, 880]
      mo: [2140, 880] # right of the stage, out of sight
    faces: { mo: left } # Mo comes in from the right, looking at Pip
    beats:
      - name: waits
        takes: 3
        says:
          - { who: narrator, text: "Pip stands in the meadow. The sun is high." }
      - name: mo-walks-in # a walk, while Pip waves
        takes: 3
        walk: { who: mo, to: [1240, 880] }
        pose: { pip: wave }
        says:
          - { who: pip, text: "Hello, Mo! Come over here!" }
      - name: mo-greets
        takes: 2.5
        pose: { pip: stand, mo: wave }
        says:
          - { who: mo, text: "Hello, Pip!" }
      - name: sun-goes-down # the background changes; nobody moves
        takes: 3.5
        background: sundown
        pose: { mo: stand }
        says:
          - { who: narrator, text: "They play all day, until the sun goes down." }
      - name: mo-turns # a turn: Mo looks round at the sun
        takes: 0.6
        turn: { who: mo }
      - name: mo-points
        takes: 3
        pose: { mo: point }
        says:
          - { who: mo, text: "Look, Pip! The sun is going to bed." }
      - name: night-falls # the background changes again
        takes: 3.5
        background: night
        pose: { mo: stand }
        says:
          - { who: narrator, text: "Then the night comes, and the moon is up." }
      - name: pip-jumps # a jump of two hops
        takes: 1.2
        jump: { who: pip, times: 2 }
        says:
          - { who: pip, text: "Hooray! The stars are out!" }
      - name: mo-turns-back
        takes: 0.6
        turn: { who: mo }
      - name: good-night # both wave
        takes: 5
        pose: { pip: wave, mo: wave }
        says:
          - { who: mo, text: "Good night, Pip." }
          - { who: pip, text: "Good night, Mo." }
