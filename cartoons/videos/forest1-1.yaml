use: cartoon
scenes:
  - background: glade
    places: { mole: off-left, rabbit: right }
    faces: { rabbit: left }
    script: |
      narrator say: All morning, Mole whitewashed his home.
      narrator say: Spring called him up into the sunlight.
      mole walk to=left
      & mole say: Hang spring-cleaning! This is fine!
      mole jump times=2
      mole walk to=middle
      & narrator say: He trotted across the moss to a thicket.
      rabbit point
      & rabbit say: Sixpence for passing by the private path!
      rabbit stand
      & mole jump
      & mole say: Acorn-sauce!
      rabbit turn
      rabbit walk to=off-right
      & narrator say: Mole bowled past the grumpy old rabbit.
      mole walk to=off-right
      & narrator say: He rambled on through sunlit clearings.
  - background: oak-foot
    places: { mole: off-left, squirrel: off-right }
    faces: { squirrel: left }
    script: |
      mole walk to=middle
      & in order:
        narrator say: Soon he stood beneath a colossal oak.
        narrator say: Never had he seen the Deep Forest Canopy.
      squirrel walk to=right
      & narrator say: From a beech hollow peered a Red Squirrel.
      squirrel wave
      & squirrel say: Hullo, Mole! Would you like to come up?
      squirrel stand
      & mole say: Oh, it's all very well to talk.
      narrator say: Squirrel lowered a mossy basket on vines.
      narrator say: He hauled Mole smoothly into the boughs.
  - background: canopy
    places: { mole: left, squirrel: right }
    faces: { squirrel: left }
    script: |
      mole jump
      & mole say: I've never been up in the trees before!
      squirrel say: Nothing is half so worth doing,
      squirrel say: as simply messing about in the treetops.
      mole point
      & mole say: Look above, Squirrel!
      mole stand
      & squirrel jump
      & narrator say: Too late! The basket struck a stout limb.
      squirrel say: Or with branches! Shall we travel together?
      mole jump times=2
      & narrator say: Mole waggled his toes in pure bliss.
