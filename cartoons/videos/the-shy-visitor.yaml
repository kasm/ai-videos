# The shy visitor, from stories/the-shy-visitor.md: Tuk comes over the hills, and Pip and Mo take
# him in for the night. One scene in the meadow, from morning to night. The format is in CLAUDE.md
# ("The script"); Pip, Mo, Tuk and the backgrounds are drawn in library.yaml.
use: cartoon # the plugin that draws it; the voices are library.yaml's, the other settings package.json's "ai-videos"

scenes:
  - background: morning
    places: { pip: middle, mo: right, tuk: off-left }
    faces: { mo: left } # Pip and Mo look at each other; Tuk will come in facing right
    script: |
      narrator say: It is a sunny morning in the meadow.
      mo say: Oh, nothing ever happens here.
      tuk walk to=left
      & in order:
        narrator say: Just then, somebody new walks in.
        narrator say: It is Tuk, who has come over the hills.
      pip turn
      pip wave
      & pip say: Hello! Hello there!
      pip stand
      & narrator say: Tuk is shy.
      tuk say: Hello.
      tuk turn
      # Mo faces left already: the arm goes out over Pip's head, towards Tuk
      mo point
      & mo say: You there! Where do you come from?
      tuk turn
      & mo stand
      tuk say: I come from far away, behind the hills.
      tuk say: I am looking for a place to sleep.
      tuk say: The night is near.
      scene background to=sundown
      & narrator say: And the sun goes down.
      pip say: You can stay with us, Tuk.
      pip say: The meadow is big enough for three.
      tuk jump times=3
      & narrator say: Tuk is so glad!
      scene background to=night
      & narrator say: Then the night falls, and the moon comes up.
      pip wave
      & mo wave
      & tuk wave
      & pip say: Good night, Tuk.
      tuk say: Good night, Pip. Good night, Mo.
      mo say: Good night, you two.
      pip stand
      & mo stand
      & tuk stand
      & narrator say: And Mo was wrong. Something did happen today.
