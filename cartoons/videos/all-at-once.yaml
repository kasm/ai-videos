# What a script can have at once, one after another: a walk while the narrator talks, a chorus, an
# interruption at a word, a talk over a radio that is waited for, words that end as a walk does, and a
# murmur of two lines under three others, cut where they end. The radio and the murmur are lower than
# the talk over them, and Tuk hushes the others low. All its pauses are one beat, and the
# radio's two: beat changed times all of it anew. In the second scene Mo stands beside the reeds, a
# point of the scene's own, and Tuk comes between Pip and Mo, then up to Pip. In the third, the badger
# walks in while Tuk hops and Mo, a second later, turns round and points, Pip walks up waving and
# talking, Tuk and Mo looking at Pip all the way past them, and at a word, as the badger walks off, the
# day breaks. A tune goes on under all three scenes, the news waits for a jingle, and something rustles in
# the reeds at a word. The format is in CLAUDE.md ("The script"); the characters and the backgrounds are drawn
# in library.yaml, and the radio is only heard, as the sounds are, whose files it names.
use: cartoon
outputs: { web: true } # its page too, beside the video
cast: { radio: am_michael }
values: { beat: 0.4s, pause: beat, radio.volume: -8dB, jingle.volume: -8dB }
script: |
  tune loop

scenes:
  - background: morning
    places: { pip: left, mo: middle, tuk: off-right }
    faces: { mo: left, tuk: left }
    script: |
      tuk walk to=right
      & narrator say: Every morning, Tuk comes for the news.
      together:
        pip say: Good morning, Tuk!
        mo say: Good morning, Tuk!
      [told] pip say: Last night I saw a badger by the pond.
      mo say @ told.word(badger): A badger?
      tuk say volume=-6dB: Hush, it is beginning.
      together:
        in order pause=beat * 2:
          jingle play
          radio say: Good morning, and here is the news.
          [seen] radio say: A badger was seen by the pond last night.
          radio say: It has asked to be left alone.
        in order:
          pip say @ seen.word(pond): That was me, I saw it!
          mo say: They know, Pip.
      tuk say: Poor badger.
  - background: sundown
    values: { reeds: 1500 }
    places:
      pip: left
      mo: left-of(reeds, near)
      tuk: off-right
    faces: { tuk: left, mo: left }
    script: |
      ending together:
        tuk walk to=midpoint(pip, mo)
        narrator say: In the evening, Mo counts the reeds.
      in order:
        under volume=-12dB:
          mo say: One reed, two reeds, three reeds, four reeds.
          mo say: Five reeds, six reeds, seven reeds, eight reeds.
        pip say: Why is Mo counting?
        tuk say: The badger is behind one.
        pip say: And which one?
      tuk walk to=right-of(pip, near)
      & narrator say: That, only the badger knows.
  - background: night
    places: { tuk: 520, mo: 800, badger: off-right, pip: 240 }
    faces: { mo: left, badger: left }
    script: |
      together:
        badger walk to=right
        tuk jump times=2
        mo turn @ block.start + 1s
        mo point @ prev.end
        narrator say: And then the badger comes out of the reeds.
        rustle play @ prev.word(badger)
      together:
        pip walk to=left-of(badger, near)
        pip wave
        pip say: Good evening, badger! It was me who saw you!
        mo stand
        tuk look-at target=pip
        mo look-at target=pip
      badger say: I asked to be left alone.
      & pip stand
      badger turn
      badger walk to=off-right
      & pip wave
      & [home] narrator say: And as the day breaks, the badger goes home.
      scene background to=morning @ home.word(breaks)
