# A short day with every action a character has but a look: each pose of the arm (stand, wave,
# point), each move (walk, turn, jump), eyes that blink, and a background that changes twice while Pip
# and Mo stay where they are. The format is in CLAUDE.md ("The script"); Pip, Mo and the backgrounds
# are drawn in library.yaml.
use: cartoon # the plugin that draws it; the voices are library.yaml's, the other settings package.json's "ai-videos"

scenes:
  - background: morning
    places: { pip: middle, mo: off-right }
    faces: { mo: left } # Mo comes in from the right, looking at Pip
    script: |
      narrator say: Pip stands in the meadow. The sun is high.
      mo walk to=right
      & pip wave
      & pip say: Hello, Mo! Come over here!
      pip stand
      & mo wave
      & mo say: Hello, Pip!
      scene background to=sundown
      & mo stand
      & narrator say: They play all day, until the sun goes down.
      mo turn
      mo point
      & mo say: Look, Pip! The sun is going to bed.
      scene background to=night
      & mo stand
      & narrator say: Then the night comes, and the moon is up.
      pip jump times=2
      & pip say: Hooray! The stars are out!
      mo turn
      pip wave
      & mo wave
      & mo say: Good night, Pip.
      pip say: Good night, Mo.
