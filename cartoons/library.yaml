backgrounds:
  meadow: # the plain meadow: the sky, the sun and the grass
    fill: "#bfe3ff"
    shapes:
      - { shape: ellipse, at: [1560, 220], size: [180, 180], fill: "#ffd966" }
      - { shape: rect, at: [960, 950], size: [1920, 260], fill: "#7cc36a" }
  # The meadow with the hills on the left, at three times of day.
  morning:
    fill: "#bfe3ff" # the sky
    shapes:
      - { shape: ellipse, at: [1700, 230], size: [180, 180], fill: "#ffd966" } # the sun, high
      - { shape: ellipse, at: [240, 850], size: [860, 400], fill: "#a9d9a0" } # the hills, far and pale
      - { shape: ellipse, at: [800, 860], size: [620, 260], fill: "#b7e0ad" }
      - { shape: rect, at: [960, 950], size: [1920, 260], fill: "#7cc36a" } # the grass
  sundown:
    fill: "#f6b26b"
    shapes:
      - { shape: rect, at: [960, 200], size: [1920, 400], fill: "#f9cb9c" } # the sky is paler higher up
      - { shape: ellipse, at: [1750, 790], size: [240, 240], fill: "#e8542f" } # the sun, half behind the grass
      - { shape: ellipse, at: [240, 850], size: [860, 400], fill: "#8fb276" }
      - { shape: ellipse, at: [800, 860], size: [620, 260], fill: "#9dbd80" }
      - { shape: rect, at: [960, 950], size: [1920, 260], fill: "#5f9a55" }
  night:
    fill: "#1b2a4a"
    shapes:
      - { shape: ellipse, at: [1180, 200], size: [160, 160], fill: "#f4f1de" } # the moon
      - { shape: ellipse, at: [300, 160], size: [14, 14], fill: "#f4f1de" } # the stars
      - { shape: ellipse, at: [620, 300], size: [10, 10], fill: "#f4f1de" }
      - { shape: ellipse, at: [900, 120], size: [12, 12], fill: "#f4f1de" }
      - { shape: ellipse, at: [1500, 340], size: [10, 10], fill: "#f4f1de" }
      - { shape: ellipse, at: [1780, 180], size: [12, 12], fill: "#f4f1de" }
      - { shape: ellipse, at: [240, 850], size: [860, 400], fill: "#223f4a" }
      - { shape: ellipse, at: [800, 860], size: [620, 260], fill: "#27474d" }
      - { shape: rect, at: [960, 950], size: [1920, 260], fill: "#2f5d46" }
  glade: # sunlit forest glade with mossy ground and dark tree trunks
    fill: "#cfe8b8"
    shapes:
      - { shape: rect, at: [190, 420], size: [150, 840], fill: "#5c4332" }
      - { shape: rect, at: [1740, 420], size: [170, 840], fill: "#5c4332" }
      - { shape: ellipse, at: [960, 110], size: [1920, 320], fill: "#4f8a42" }
      - { shape: rect, at: [960, 950], size: [1920, 260], fill: "#5a9649" }
  oak-foot: # foot of an ancient colossal oak beside a beech tree
    fill: "#b8dba3"
    shapes:
      - { shape: rect, at: [240, 420], size: [360, 840], fill: "#4a3525" }
      - { shape: rect, at: [1680, 420], size: [260, 840], fill: "#6e5d4f" }
      - { shape: ellipse, at: [1680, 470], size: [90, 140], fill: "#241d17" }
      - { shape: rect, at: [960, 950], size: [1920, 260], fill: "#4d853e" }
  canopy: # high emerald forest canopy with sunlit boughs and leaves
    fill: "#9cd48c"
    shapes:
      - { shape: ellipse, at: [480, 180], size: [1100, 380], fill: "#3e7834" }
      - { shape: ellipse, at: [1480, 190], size: [1050, 380], fill: "#48853d" }
      - { shape: rect, at: [960, 950], size: [1920, 260], fill: "#557d3e" }
  elm-bower: # mossy platform high in an ancient elm beside a dark thicket
    fill: "#96cf86"
    shapes:
      - { shape: ellipse, at: [1650, 360], size: [620, 740], fill: "#263d29" }
      - { shape: ellipse, at: [620, 170], size: [1200, 360], fill: "#3e7834" }
      - { shape: rect, at: [960, 950], size: [1920, 260], fill: "#4d7839" }
  squirrel-drey: # warm cozy tree hollow lit by a golden resin-lamp
    fill: "#3b2416"
    shapes:
      - { shape: ellipse, at: [960, 520], size: [1480, 860], fill: "#593722" }
      - { shape: ellipse, at: [1520, 420], size: [260, 260], fill: "#f7c85c" }
      - { shape: rect, at: [960, 950], size: [1920, 260], fill: "#6e472b" }

sounds: # a script plays them; each its file, from this folder, and how loud it is (sounds/make.mjs made these)
  tune: { file: sounds/tune.flac, volume: -20dB } # eight quiet seconds of music, to be looped
  jingle: { file: sounds/jingle.flac } # four notes up, as on a radio before the news
  rustle: { file: sounds/rustle.flac, volume: -6dB } # somebody in the reeds
